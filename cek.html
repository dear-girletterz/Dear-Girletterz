<!DOCTYPE html>
<html>
<head>
  <title>Cek Balasan 🪧</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    body{
      margin:0;
      font-family:Poppins;
      background:linear-gradient(135deg,#A9D6FF,#D6ECFF,#E6DCFF);
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .box{
      width:90%;
      max-width:420px;
      background:rgba(255,255,255,0.35);
      backdrop-filter: blur(15px);
      padding:25px;
      border-radius:20px;
      text-align:center;
    }

    input{
      width:100%;
      padding:12px;
      border:none;
      border-radius:12px;
      outline:none;
    }

    button{
      margin-top:10px;
      width:100%;
      padding:12px;
      border:none;
      border-radius:12px;
      background:white;
      cursor:pointer;
    }

    .hasil{
      margin-top:15px;
      font-weight:500;
      color:#1f2a44;
      white-space:pre-wrap;
    }
  </style>
</head>

<body>

  <div class="box">
    <h2>Cek Balasan 🪧</h2>

    <input id="kode" placeholder="Masukkan kode GLTZ...">

    <button onclick="cek()">Cek Balasan ☘️</button>

    <div class="hasil" id="hasil"></div>
  </div>

  <script type="module">
    import { db } from "./firebase.js";
    import { collection, getDocs } 
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    window.cek = async function(){

      let kode = document.getElementById("kode").value;
      let hasil = document.getElementById("hasil");

      if(!kode){
        hasil.innerText = "masukin kode dulu ya 💙";
        return;
      }

      let snap = await getDocs(collection(db, "curhat"));

      let ketemu = false;

      snap.forEach(doc => {
        let data = doc.data();

        if(data.code === kode){
          ketemu = true;

          if(data.reply && data.reply !== ""){
            hasil.innerText = "💬 BALASAN:\n\n" + data.reply;
          } else {
            hasil.innerText = "⏳ belum ada balasan dari admin";
          }
        }
      });

      if(!ketemu){
        hasil.innerText = "kode tidak ditemukan ❌";
      }
    }
  </script>

</body>
</html>
