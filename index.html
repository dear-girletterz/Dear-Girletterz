<!DOCTYPE html>
<html>
<head>
  <title>Curhat Space 🌊</title>
  <style>
    body{
      font-family: Arial;
      background: linear-gradient(135deg,#a9d6ff,#d6ecff,#d9d4ff);
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:30px;
    }

    textarea{
      width:90%;
      max-width:400px;
      height:120px;
      border-radius:12px;
      padding:10px;
      border:none;
    }

    button{
      margin-top:10px;
      padding:10px 20px;
      border:none;
      border-radius:10px;
      background:white;
      cursor:pointer;
    }

    .post{
      background:rgba(255,255,255,0.5);
      padding:10px;
      margin-top:10px;
      border-radius:10px;
      width:90%;
      max-width:400px;
    }
  </style>
</head>

<body>

  <h2>Curhat Space 🌊</h2>

  <textarea id="input"></textarea>
  <br>
  <button onclick="post()">Kirim</button>

  <div id="feed"></div>

  <script>
    function post(){
      let text = document.getElementById("input").value;

      if(text.trim() === "") return;

      let div = document.createElement("div");
      div.className = "post";
      div.innerText = text;

      document.getElementById("feed").prepend(div);

      document.getElementById("input").value = "";
    }
  </script>

</body>
</html>
