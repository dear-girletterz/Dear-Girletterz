<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard 🔒</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    body{
      margin:0;
      font-family:Poppins;
      background:linear-gradient(135deg,#A9D6FF,#D6ECFF,#E6DCFF);
      padding:20px;
    }

    h2{
      text-align:center;
      color:#1f2a44;
    }

    .card{
      background:rgba(255,255,255,0.4);
      backdrop-filter: blur(12px);
      padding:15px;
      margin:10px 0;
      border-radius:15px;
    }

    .code{
      font-weight:bold;
      color:#2b2b2b;
    }

    .text{
      margin-top:5px;
      font-size:14px;
    }

    .status{
      margin-top:8px;
      font-weight:600;
      font-size:13px;
    }

    .done{
      color:green;
    }

    .pending{
      color:orange;
    }
  </style>
</head>

<body>

  <h2>Curhat Masuk 💌</h2>

  <div id="list"></div>

  <script type="module">
    import { db } from "./firebase.js";
    import { collection, getDocs } 
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    async function loadData(){

      let snap = await getDocs(collection(db, "curhat"));

      let html = "";

      snap.forEach(doc => {
        let data = doc.data();

        let statusText = (data.isReplied === true) 
          ? "✔ SUDAH DIBALAS"
          : "⏳ BELUM DIBALAS";

        let statusClass = data.isReplied 
          ? "done"
          : "pending";

        html += `
          <div class="card">
            <div class="code">${data.code}</div>
            <div class="text">${data.text}</div>

            <div class="status ${statusClass}">
              ${statusText}
            </div>
          </div>
        `;
      });

      document.getElementById("list").innerHTML = html;
    }

    loadData();
  </script>

</body>
</html>
