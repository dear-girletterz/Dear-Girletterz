<!DOCTYPE html>
<html>
<head>
  <title>Dashboard Admin 🔓</title>
</head>

<body style="font-family:Arial;padding:20px;">

  <h2>Curhat Masuk 🗳</h2>

  <div id="list"></div>

  <script>
    let data = [
      {kode:"GLTZ-1234", isi:"aku capek"},
      {kode:"GLTZ-5678", isi:"aku bingung"}
    ];

    let html = "";

    data.forEach(d=>{
      html += `
        <div style="padding:10px;border:1px solid #ccc;margin:10px;">
          <b>${d.kode}</b><br>
          ${d.isi}
          <br><button>Balas</button>
        </div>
      `;
    });

    document.getElementById("list").innerHTML = html;
  </script>

</body>
</html>
