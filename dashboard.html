<!DOCTYPE html>
<html>
<head>
  <title>Dashboard Admin 🔒</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    body{
      margin:0;
      font-family:Poppins;
      background:linear-gradient(135deg,#A9D6FF,#D6ECFF,#E6DCFF);
      padding:20px;
    }

    h2{
      text-align:center;
      color:#1f2a44;
    }

    .card{
      background:rgba(255,255,255,0.4);
      backdrop-filter: blur(12px);
      padding:15px;
      margin:10px 0;
      border-radius:15px;
    }

    .code{
      font-weight:bold;
      color:#1f2a44;
    }

    input{
      width:100%;
      margin-top:8px;
      padding:8px;
      border:none;
      border-radius:10px;
      outline:none;
    }

    button{
      margin-top:8px;
      padding:8px 12px;
      border:none;
      border-radius:10px;
      background:white;
      cursor:pointer;
    }
  </style>
</head>

<body>

  <h2>Curhat Masuk 💌</h2>

  <div id="list"></div>

  <script type="module">
    import { db } from "./firebase.js";
    import { collection, getDocs, doc, updateDoc } 
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    async function load(){

      let snap = await getDocs(collection(db, "curhat"));

      let html = "";

      snap.forEach(d => {
        let data = d.data();

        html += `
          <div class="card">
            <div class="code">📌 ${data.code}</div>
            <div>${data.text}</div>

            <input id="r-${data.code}" placeholder="tulis balasan...">

            <button onclick="balas('${d.id}','${data.code}')">
              Balas 💬
            </button>
          </div>
        `;
      });

      document.getElementById("list").innerHTML = html;
    }

    window.balas = async function(id, code){
      let text = document.getElementById("r-"+code).value;

      if(text.trim() === "") return;

      await updateDoc(doc(db,"curhat",id),{
        reply:text
      });

      alert("Balasan terkirim 💕");
    }

    load();
  </script>

</body>
</html>
