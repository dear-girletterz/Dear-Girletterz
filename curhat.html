<!DOCTYPE html>
<html>
<head>
  <title>Curhat Space 📝</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

  <style>
    body{
      margin:0;
      font-family:'Poppins';
      background:linear-gradient(135deg,#A9D6FF,#D6ECFF,#E6DCFF);
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .box{
      width:90%;
      max-width:420px;
      background:rgba(255,255,255,0.35);
      backdrop-filter: blur(15px);
      padding:25px;
      border-radius:20px;
      text-align:center;
    }

    textarea{
      width:100%;
      height:120px;
      border:none;
      border-radius:15px;
      padding:12px;
      font-family:'Inter';
      outline:none;
      resize:none;
    }

    .hint{
      font-size:12px;
      opacity:0.6;
      margin-bottom:10px;
    }

    .btn{
      margin-top:12px;
      padding:12px;
      width:100%;
      border:none;
      border-radius:12px;
      background:white;
      cursor:pointer;
      transition:0.3s;
    }

    .btn:hover{
      transform:scale(1.02);
    }

    .code{
      margin-top:15px;
      font-weight:600;
      color:#1f2a44;
    }

    .small{
      font-size:12px;
      opacity:0.6;
    }

  </style>
</head>

<body>

  <div class="box">

    <h2>Curhat Space 📝</h2>

    <textarea id="text" placeholder="keluarin semuanya dalam tulisan aja, fighting! ^O^"></textarea>

    <button class="btn" onclick="kirim()">Kirim 💖</button>

    <div class="code" id="kode"></div>
    <div class="small">salin kode ini untuk lihat balasan nanti</div>
    <button class="btn" onclick="copy()">Salin Kode 📋</button>

  </div>

  <script>
    function gen(){
      return "GLTZ-" + Math.floor(Math.random()*9000+1000);
    }

    let last="";

    function kirim(){
      last = gen();
      document.getElementById("kode").innerText = last;
    }

    function copy(){
      navigator.clipboard.writeText(last);
      alert("kode disalin ✨");
    }
  </script>

</body>
</html>
