<!DOCTYPE html>
<html>
<head>
  <title>Curhat Space 📝</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    body{
      margin:0;
      font-family:Poppins;
      background:linear-gradient(135deg,#A9D6FF,#D6ECFF,#E6DCFF);
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .box{
      width:90%;
      max-width:420px;
      background:rgba(255,255,255,0.35);
      backdrop-filter: blur(15px);
      padding:25px;
      border-radius:20px;
      text-align:center;
    }

    textarea{
      width:100%;
      height:120px;
      border:none;
      border-radius:15px;
      padding:12px;
      outline:none;
    }

    button{
      margin-top:10px;
      padding:12px;
      width:100%;
      border:none;
      border-radius:12px;
      background:white;
      cursor:pointer;
    }

    .code{
      margin-top:15px;
      font-weight:bold;
      color:#1f2a44;
    }
  </style>
</head>

<body>

  <div class="box">
    <h2>Curhat Space 📝</h2>

    <textarea id="text" placeholder="tulis apa yang kamu rasain..."></textarea>

    <button onclick="kirim()">Kirim 💖</button>

    <div class="code" id="kode"></div>
    <button onclick="copy()">Salin Kode 📋</button>
  </div>

  <script type="module">
    import { db } from "./firebase.js";
    import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    function generateCode(){
      return "GLTZ-" + Math.floor(Math.random()*9000+1000);
    }

    let lastCode = "";

    window.kirim = async function(){
      let text = document.getElementById("text").value;

      if(text.trim() === "") return;

      lastCode = generateCode();

      // 🔥 SIMPAN KE FIREBASE
      await addDoc(collection(db, "curhat"), {
        text: text,
        code: lastCode,
        reply: "",
        time: Date.now()
      });

      document.getElementById("kode").innerText = lastCode;
      alert("Curhat terkirim 💕");
      document.getElementById("text").value = "";
    }

    window.copy = function(){
      navigator.clipboard.writeText(lastCode);
      alert("Kode disalin ✨");
    }
  </script>

</body>
</html>
